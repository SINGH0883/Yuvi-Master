<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuvi Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 250px;
      height: 185px;
      background: #ffffff;
      overflow: hidden;
      border-radius: 16px;
    }

    .card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: -0.2px;
    }

    .tagline {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    .emoji {
      font-size: 20px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .thanks-pill {
      font-size: 10.5px;
      font-weight: 600;
      color: #0f172a;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .footer {
      font-size: 9.5px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-pill">
      <div class="brand-icon">⚡</div>
      <div class="logo">Yuvi Master</div>
    </div>

    <div class="tagline">Smart Copy & Paste Tool ⚡</div>

    <div class="emoji">🚀</div>

    <div class="thanks-pill">Thanks for using 😊</div>

    <div class="footer">Made with ❤️ by Yuvraj Singh</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
